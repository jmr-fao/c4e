    contents:
      - grid_indicators
      - grid_controls
      - grid_methods

  - title: Reading rasters and boundaries
    contents:
      - read_climate
      - raster_meta
      - list_sources
      - register_source
      - read_boundaries
      - aggregate_time
      - select_by_dates
      - select_by_season
      - convert_unit
      - list_units
