url: https://jmr-fao.github.io/c4e/

template:
  bootstrap: 5

home:
  title: "c4e: climate data for economists"

reference:
  - title: One call per question
    desc: >
      Wrappers that run the whole chain from a survey and a raster, with
      presets and a short argument list.
    contents:
      - weather_extremes
      - climate_indices
      - static_controls
      - time_varying_controls
      - list_presets
      - extremes_control

  - title: Every cell of a raster
